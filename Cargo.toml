[package]
name = "reader"
version = "0.1.0"
edition = "2021"
description = "A local-first CLI/TUI reading tool for EPUB and TXT books."
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = { version = "0.30.0", features = ["crossterm_0_29"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-width = "0.2"
zip = "8.6.0"

[dev-dependencies]
tempfile = "3"
